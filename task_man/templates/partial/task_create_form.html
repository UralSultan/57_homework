<form method="post" class="task-form">
    {% csrf_token %}
    {{ form.as_p }}

<div class="form-actions">
    {% if task %}
        <a class="button button-secondary"
           href="{% url 'task_view' task_pk=task.pk %}">
            Отмена
        </a>
    {% else %}
        <a class="button button-secondary"
           href="{% url 'task_list' %}">
            Отмена
        </a>
    {% endif %}

    <button class="button" type="submit">{{ button_value }}</button>
</div>
</form>
