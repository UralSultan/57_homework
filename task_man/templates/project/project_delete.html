{% extends 'base.html' %}

{% block title %}Удаление проекта — Мои проекты{% endblock %}

{% block content %}
    <a class="back-link" href="{% url 'project_detail' pk=project.pk %}">← К проекту</a>
    <section class="form-card danger-card">
        <p class="eyebrow">Удаление</p>
        <h1>Удалить проект?</h1>
        <p>Проект «{{ project.title }}» будет удалён вместе со всеми его задачами.</p>
        <form method="post" class="form-actions">
            {% csrf_token %}
            <a class="button button-secondary" href="{% url 'project_detail' pk=project.pk %}">Отмена</a>
            <button class="button button-danger" type="submit">Удалить проект</button>
        </form>
    </section>
{% endblock %}
