{% extends 'base.html' %}

{% block title %}Новый проект — Мои проекты{% endblock %}

{% block content %}
    <a class="back-link" href="{% url 'projects_view' %}">← Все проекты</a>
    <div class="page-heading">
        <div>
            <p class="eyebrow">Планирование</p>
            <h1>Новый проект</h1>
            <p class="page-description">Создай проект, а затем добавляй в него задачи.</p>
        </div>
    </div>

    <section class="form-card">
        <form method="post" class="task-form">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <a class="button button-secondary" href="{% url 'projects_view' %}">Отмена</a>
                <button class="button" type="submit">Создать проект</button>
            </div>
        </form>
    </section>
{% endblock %}
